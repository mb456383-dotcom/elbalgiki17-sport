<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البـلجيكــ17ــي سبورت - Yalla Shoot Replica</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --header-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        /* Top Header */
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .logo i {
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        /* Date Switcher Bar */
        .date-bar {
            display: flex;
            background-color: var(--card-bg);
            padding: 8px;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .date-btn {
            flex: 1;
            min-width: 90px;
            padding: 8px;
            text-align: center;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }

        .date-btn.active {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 700;
        }

        /* Main Container */
        .container {
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Section Title */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent-green);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Match Card */
        .match-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .match-status {
            text-align: center;
            font-size: 0.75rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .status-live {
            color: var(--accent-red);
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .match-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .team-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .team-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .match-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .score-box {
            background: #0f172a;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-green);
            border: 1px solid var(--border-color);
        }

        .match-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .match-footer {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-around;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .match-footer span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Video Player Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-header {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 3px;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-futbol"></i>
            <span>البـلجيكــ17ــي سبورت</span>
        </div>
        <div class="header-actions">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bell"></i>
        </div>
    </header>

    <!-- Date Navigation -->
    <div class="date-bar">
        <button class="date-btn">الأمس</button>
        <button class="date-btn active">اليوم</button>
        <button class="date-btn">الغد</button>
    </div>

    <!-- Main Matches Container -->
    <div class="container">
        
        <!-- League 1 -->
        <div class="section-header">
            <span class="section-title"><i class="fa-solid fa-trophy"></i> دوري أبطال أوروبا</span>
        </div>

        <!-- Match Item 1 (Live) -->
        <div class="match-card" onclick="openLive('ريال مدريد', 'برشلونة')">
            <div class="match-status status-live">
                <i class="fa-solid fa-circle"></i> مباشر - الشوط الثاني ('65)
            </div>
            <div class="match-body">
                <div class="team">
                    <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" class="team-logo" alt="Real Madrid">
                    <span class="team-name">ريال مدريد</span>
                </div>
                <div class="match-score">
                    <div class="score-box">2 - 1</div>
                </div>
                <div class="team">
                    <img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" class="team-logo" alt="Barcelona">
                    <span class="team-name">برشلونة</span>
                </div>
            </div>
            <div class="match-footer">
                <span><i class="fa-solid fa-tv"></i> beIN Sports HD 1</span>
                <span><i class="fa-solid fa-user"></i> حفيظ دراجي</span>
            </div>
        </div>

        <!-- Match Item 2 (Scheduled) -->
        <div class="match-card">
            <div class="match-status">
                <i class="fa-regular fa-clock"></i> لم تبدأ بعد
            </div>
            <div class="match-body">
                <div class="team">
                    <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_City_FC_badge.svg" class="team-logo" alt="Man City">
                    <span class="team-name">مانشستر سيتي</span>
                </div>
                <div class="match-score">
                    <div class="score-box">VS</div>
                    <span class="match-time">10:00 م</span>
                </div>
                <div class="team">
                    <img src="https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg" class="team-logo" alt="Chelsea">
                    <span class="team-name">تشيلسي</span>
                </div>
            </div>
            <div class="match-footer">
                <span><i class="fa-solid fa-tv"></i> beIN Sports HD 2</span>
                <span><i class="fa-solid fa-user"></i> خليل البلوشي</span>
            </div>
        </div>

    </div>

    <!-- Live Player Modal -->
    <div id="liveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle" style="font-weight:700;">بث مباشر</span>
                <span class="close-btn" onclick="closeLive()">&times;</span>
            </div>
            <div class="video-container">
                <!-- Example Embedded Stream -->
                <iframe src="https://www.youtube.com/embed/live_stream?channel=EXPLORE" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-futbol"></i>
            <span>المباريات</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-newspaper"></i>
            <span>الأخبار</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-list-ol"></i>
            <span>الترتيب</span>
        </a>
    </nav>

    <script>
        function openLive(home, away) {
            document.getElementById('modalTitle').innerText = home + " vs " + away;
            document.getElementById('liveModal').style.display = 'flex';
        }

        function closeLive() {
            document.getElementById('liveModal').style.display = 'none';
        }
    </script>
</body>
</html>
